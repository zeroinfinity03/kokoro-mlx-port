[project]
name = "kokoro-mlx-tests"
version = "0.1.0"
description = "The official PyTorch Kokoro (the reference) and what the gates need. Never needed to run kokoro_mlx."
requires-python = ">=3.10,<3.13"
dependencies = [
  "kokoro==0.9.4",
  "misaki[en]==0.9.4",
  "spacy>=3.8,<3.9",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "safetensors",
  "numpy",
  "mlx==0.32.3",
]

[tool.uv]
package = false
